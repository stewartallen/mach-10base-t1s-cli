[package]
name = "mach-10base-t1s-cli"
version = "0.2.0"
edition = "2024"
description = "Configure a MACH SYSTEMS 10BASET1S-USB-IF dongle (PLCA, roles, diagnostics) over its CDC-ACM control channel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stewartallen/mach-10base-t1s-cli"
readme = "README.md"
keywords = ["10base-t1s", "plca", "ethernet", "serial", "802-3cg"]
categories = ["command-line-utilities", "hardware-support"]

# Edition 2024 requires a recent toolchain.
rust-version = "1.85"

[lib]
name = "mach_10base_t1s_cli"
path = "src/lib.rs"

[[bin]]
name = "t1s-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.10.0"
thiserror = "2.0.20"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# Lint *groups* must be given a lower priority than individual lints so the
# ordering is unambiguous (Cargo's `lint_groups_priority` check requires it).
rust_2018_idioms = { level = "warn", priority = -1 }
# There is nothing wrong with unsafe code, but you should know why you are
# adding it. Denied (not forbidden) so you can opt in per-module with a
# justified `#![allow(unsafe_code)]`. https://jack.wrenn.fyi/blog/safety-hygiene/
unsafe_code = "deny"
